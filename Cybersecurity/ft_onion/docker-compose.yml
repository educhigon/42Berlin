services:
  ft_onion:
    container_name: ft_onion
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - tor_web:/var/lib/tor/web
      - tor_ssh:/var/lib/tor/ssh
      - sshd_host_keys:/etc/ssh/host_keys
      - ssh_authorized:/home/${SSH_USER}/.ssh

volumes:
  tor_web:
  tor_ssh:
  sshd_host_keys:
  ssh_authorized: