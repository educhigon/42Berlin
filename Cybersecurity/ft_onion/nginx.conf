user www-data;            # master runs as root, workers drop to www-data
worker_processes 1;
pid /run/nginx.pid;
 
events {
    worker_connections 1024;
}
 
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
 
    access_log /dev/stdout;
    error_log  /dev/stderr;
    server_tokens off;
    server {
        listen 127.0.0.1:80;

        server_name _;            # catch-all: we don't care about Host
        root  /var/www/html;
        index index.html;
 
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
