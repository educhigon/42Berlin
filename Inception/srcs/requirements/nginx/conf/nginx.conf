events {
    worker_connections  1024;
}
http {
	# server {
  #   listen 80;
  #   listen [::]:80;
  #   server_name edugonza.42.fr;
  #   return 301 https://$host$request_uri;
	# }
	server {
		server_name edugonza.42.fr;
		listen 443 ssl;
		listen [::]:443 ssl;

		ssl_certificate     /etc/nginx/ssl/nginx.crt;
		ssl_certificate_key /etc/nginx/ssl/nginx.key;
		ssl_protocols       TLSv1.2 TLSv1.3;

		root /var/www/html;
		index index.php;
		client_max_body_size 500k;
		error_page 400 ./error_pages/400.html;
		# error_page 400 /error_pages/400.html;
		# location = /error_pages/400.html { internal; root /var/www/html; }
		error_page 403 ./error_pages/403.html;
		error_page 404 ./error_pages/404.html;
		error_page 500 ./error_pages/500.html;

		location = / {
				try_files /home.html =404;
		}

		location = /about {
				try_files /about.html =404;
		}

		location / {
				try_files $uri $uri/ /index.php?$args;
		}

		location ~ \.php$ {
				fastcgi_pass wordpress:9000;
				fastcgi_index index.php;
				include fastcgi_params;
				fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

	}
}

# Nginx's configuration is structured in contexts — nested blocks that group directives by scope. The top-level contexts are
# events, http, stream, and a few others. Nginx's architecture requires the events block to exist because nginx needs to know
# how to handle the underlying I/O event loop before it can do anything else. It's not optional syntax — nginx will refuse to
# start without it, even if you put nothing inside it.
# worker_connections 1024 just means each worker process can hold up to 1024 open connections simultaneously.

####### PHP-FPM config:
# location ~ \.php$ — the ~ means regex match. This catches any request URI ending in .php.
# fastcgi_pass wordpress:9000 — instead of serving the file itself, nginx opens a TCP connection to the wordpress container on port 9000 and speaks the FastCGI protocol. FastCGI is a simple binary protocol for passing a request to a process that will execute it.
# fastcgi_index index.php — if the request is for a directory (ending in /), use index.php as the default file. Same concept as index index.html for static files.
# include fastcgi_params — this includes a standard file (shipped with nginx) that sets a bunch of variables php-fpm expects: REQUEST_METHOD, QUERY_STRING, SERVER_NAME, etc. Without these, php-fpm doesn't know anything about the HTTP request it's supposed to handle.
# fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name — this is the single most important line. FastCGI doesn't pass a URL to php-fpm; it passes a file path. $document_root is your root /var/www/html and $fastcgi_script_name is the URI path (e.g. /index.php). Combined: /var/www/html/index.php. Without this, php-fpm receives no file to execute and returns a blank response.
